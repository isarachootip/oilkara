<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอเพลง · Oilkara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: single phone column — sticky "now singing" strip, then name → find song → queue */
:root{
  --stage:#17121f; --panel:#211a2c; --line:#3a2f4a; --ink:#f3ecf8; --muted:#a99bb8;
  --lyric:#ffb43d; --lyric-ink:#2a1a00; --cue:#7fd6c2; --danger:#ff7a8a;
  --f-display:"Mitr","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink);font:16px/1.5 var(--f-body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lyric);outline-offset:2px}
.now{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:#120d18f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px}
.now .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.now .t{font:500 1rem/1.3 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .t em{font-style:normal;color:var(--lyric)}
main{max-width:560px;margin:0 auto;padding:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1{font:600 1.5rem/1.2 var(--f-display);margin:0;display:flex;align-items:center;gap:10px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--lyric);box-shadow:0 0 12px var(--lyric)}
h2{font:500 .78rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
input[type=text],input[type=search]{width:100%;min-width:0;background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.row{display:flex;gap:8px}
.row input{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;white-space:nowrap}
.btn.primary{background:var(--lyric);color:var(--lyric-ink);border-color:var(--lyric);font-weight:600}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.toggle input{accent-color:var(--lyric);width:18px;height:18px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.song{display:grid;grid-template-columns:auto 88px minmax(0,1fr);gap:10px;align-items:center}
.results .song{grid-template-columns:110px minmax(0,1fr)}
.song img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;background:#000}
.song .num{font:500 1rem var(--f-display);color:var(--muted);width:24px;text-align:center;font-variant-numeric:tabular-nums}
.song .meta{min-width:0}
.song .title{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.song .sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .who{font-size:.8rem;color:var(--lyric)}
.song .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.song.mine{background:#ffb43d12;border-radius:10px;outline:1px solid #ffb43d55;padding:4px}
.mine-tag{font-size:.72rem;padding:0 7px;border-radius:999px;background:var(--lyric);color:var(--lyric-ink);margin-left:4px;font-weight:600}
.cancel{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:.8rem;color:var(--muted)}
.cancel:hover{color:var(--danger);border-color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:20px 10px;border:1px dashed var(--line);border-radius:12px}
.mystat{font:500 1rem var(--f-display);color:var(--cue)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--stage);padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:0 8px 30px #0008;z-index:50;max-width:calc(100% - 32px);text-align:center}
.off{background:#3a1420;border:1px solid #6b2433;color:#ffc2cc;border-radius:10px;padding:10px 12px;font-size:.9rem}
</style>
</head>
<body>
<div class="now"><div class="lbl">กำลังร้อง</div><div class="t" id="nowT">—</div></div>
<main>
  <h1><span class="dot"></span>ขอเพลง</h1>
  <div class="off" id="off" hidden>เชื่อมต่อห้องคาราโอเกะไม่ได้ ตรวจว่ามือถือต่อ Wi-Fi วงเดียวกับเครื่องที่เปิดจอหลัก</div>

  <section class="card">
    <h2>ชื่อคุณ</h2>
    <input type="text" id="name" placeholder="เช่น ออย" maxlength="40" autocomplete="nickname">
    <p class="hint">ชื่อจะขึ้นบนจอตอนถึงคิวคุณ</p>
  </section>

  <section class="card">
    <h2>หาเพลง</h2>
    <form class="row" id="searchForm">
      <input type="search" id="q" placeholder="ชื่อเพลง หรือ ศิลปิน" autocomplete="off" enterkeyhint="search">
      <button class="btn primary" type="submit">ค้นหา</button>
    </form>
    <label class="toggle"><input type="checkbox" id="kara" checked> เติมคำว่า “คาราโอเกะ”</label>
    <p class="hint" id="searchHint"></p>
    <ul class="list results" id="results"></ul>
    <h2 style="margin-top:6px">หรือวางลิงก์ YouTube</h2>
    <form class="row" id="linkForm">
      <input type="text" id="link" placeholder="https://youtu.be/..." inputmode="url" autocomplete="off">
      <button class="btn primary" type="submit">ขอเพลง</button>
    </form>
  </section>

  <section class="card">
    <h2>คิวเพลง</h2>
    <div class="mystat" id="mystat"></div>
    <ul class="list" id="queue"></ul>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const LS = 'oilkara.guest';
  let me = { client:'', name:'', kara:true };
  try { Object.assign(me, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e){}
  if (!me.client) me.client = 'g-' + Math.random().toString(36).slice(2, 10);
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(me)); } catch(e){} };
  save();

  let S = { now:null, queue:[], hasKey:false, ver:-1 };
  const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }

  $('#name').value = me.name;
  $('#name').addEventListener('input', e => { me.name = e.target.value.trim(); save(); });
  $('#kara').checked = me.kara;
  $('#kara').onchange = e => { me.kara = e.target.checked; save(); };

  async function poll(){
    try { const s = await fetch('/api/state', { cache:'no-store' }).then(r => r.json()); $('#off').hidden = true; if (s.ver !== S.ver) { S = s; render(); } }
    catch(e){ $('#off').hidden = false; }
  }
  poll(); setInterval(poll, 2500);

  function render(){
    $('#nowT').innerHTML = S.now ? esc(S.now.title) + (S.now.singer ? ` <em>— ${esc(S.now.singer)}</em>` : '') : 'ยังไม่มีเพลง ขอเพลงแรกได้เลย';
    $('#searchHint').textContent = S.hasKey ? '' : 'ปุ่มค้นหาจะเปิด YouTube ให้เลือกเพลง จากนั้นกด “แชร์ → คัดลอกลิงก์” แล้วกลับมาวางด้านล่าง';
    const q = $('#queue'); q.innerHTML = '';
    const mineNow = S.now && S.now.by === me.client;
    const myPos = S.queue.map((x, i) => x.by === me.client ? i + 1 : 0).filter(Boolean);
    $('#mystat').textContent = mineNow ? 'ถึงคิวคุณแล้ว ร้องเลย!' : myPos.length ? `เพลงของคุณอยู่คิวที่ ${myPos.join(', ')}` : '';
    if (!S.queue.length) { q.innerHTML = `<li class="empty">คิวว่าง เพลงที่ขอจะเล่นต่อจากเพลงนี้ทันที</li>`; return; }
    S.queue.forEach((it, i) => {
      const mine = it.by === me.client;
      const li = document.createElement('li'); li.className = 'song' + (mine ? ' mine' : '');
      li.innerHTML = `<span class="num">${i+1}</span><img src="${thumb(it.id)}" alt="" loading="lazy">
        <div class="meta"><div class="title">${esc(it.title)}</div>
        <div class="who">${esc(it.singer || '')}${mine ? '<span class="mine-tag">ของคุณ</span>' : ''}</div>
        ${mine ? `<div class="acts"><button class="cancel" data-cancel="${it.uid}">ยกเลิกเพลงนี้</button></div>` : ''}</div>`;
      q.appendChild(li);
    });
  }

  $('#queue').addEventListener('click', async e => {
    const b = e.target.closest('[data-cancel]'); if (!b) return;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'แตะอีกครั้งเพื่อยืนยัน'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'ยกเลิกเพลงนี้'; } }, 3000); return; }
    const r = await fetch('/api/action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ type:'remove', uid:b.dataset.cancel, client:me.client }) });
    const j = await r.json().catch(() => ({})); if (j.state) { S = j.state; render(); }
    toast(r.ok ? 'ยกเลิกแล้ว' : (j.error || 'ยกเลิกไม่สำเร็จ'));
  });

  async function request(payload){
    if (!me.name) { toast('ใส่ชื่อก่อน จะได้รู้ว่าใครร้อง'); $('#name').focus(); return 0; }
    try {
      const r = await fetch('/api/add', { method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ client:me.client, singer:me.name, ...payload }) });
      const j = await r.json();
      if (j.state) { S = j.state; render(); }
      if (j.added) {
        const p = j.positions[0];
        toast(p === 0 ? 'ส่งแล้ว! เพลงของคุณเริ่มเล่นเลย' : `ส่งแล้ว! คุณอยู่คิวที่ ${p}`);
      } else toast((j.errors && j.errors[0]) || 'ส่งเพลงไม่สำเร็จ');
      return j.added || 0;
    } catch(e){ toast('ส่งเพลงไม่สำเร็จ ตรวจการเชื่อมต่อ Wi-Fi'); return 0; }
  }

  $('#linkForm').addEventListener('submit', async e => {
    e.preventDefault(); const v = $('#link').value.trim(); if (!v) return;
    if (await request({ text:v })) $('#link').value = '';
  });

  let results = [];
  $('#searchForm').addEventListener('submit', async e => {
    e.preventDefault();
    const raw = $('#q').value.trim(); if (!raw) return;
    if (/youtu\.?be/.test(raw)) { if (await request({ text:raw })) $('#q').value = ''; return; }
    const q = me.kara && !/karaoke|คาราโอเกะ/i.test(raw) ? `${raw} คาราโอเกะ` : raw;
    if (!S.hasKey) { window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`, '_blank', 'noopener'); return; }
    const box = $('#results'); box.innerHTML = `<li class="hint">กำลังค้นหา…</li>`;
    try {
      const r = await fetch('/api/search?q=' + encodeURIComponent(q)); const j = await r.json();
      if (!r.ok) { box.innerHTML = `<li class="empty">${esc(j.error || 'ค้นหาไม่สำเร็จ')}</li>`; return; }
      results = j.results || []; box.innerHTML = '';
      if (!results.length) { box.innerHTML = `<li class="empty">ไม่พบเพลง ลองคำค้นอื่น</li>`; return; }
      results.forEach((it, i) => {
        const li = document.createElement('li'); li.className = 'song';
        li.innerHTML = `<img src="${thumb(it.id)}" alt="" loading="lazy"><div class="meta"><div class="title">${esc(it.title)}</div><div class="sub">${esc(it.channel)}</div>
          <div class="acts"><button class="btn primary sm" data-req="${i}">ขอเพลงนี้</button></div></div>`;
        box.appendChild(li);
      });
    } catch(err){ box.innerHTML = `<li class="empty">ค้นหาไม่สำเร็จ ตรวจการเชื่อมต่อ</li>`; }
  });
  $('#results').addEventListener('click', async e => {
    const b = e.target.closest('[data-req]'); if (!b) return;
    b.disabled = true;
    if (await request({ items:[results[+b.dataset.req]] })) { b.textContent = 'ขอแล้ว ✓'; } else b.disabled = false;
  });
})();
</script>
</body>
</html>
