<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oilkara TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed screen for the TV — video edge to edge; QR, lower-third and countdown float above it */
:root{
  --stage:#000; --room:#17121f; --ink:#f3ecf8; --muted:#a99bb8;
  --lyric:#ffb43d; --lyric-ink:#2a1a00; --cue:#7fd6c2;
  --f-display:"Mitr","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--stage);color:var(--ink);font:16px/1.5 var(--f-body);cursor:default}
body.hide-cursor{cursor:none}
#player,#player iframe{position:fixed;inset:0;width:100vw;height:100vh;border:0}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:4vh 4vw}
.qrbox{background:#fff;padding:1vh;border-radius:1.2vh;line-height:0;display:inline-block}
.qrbox img,.qrbox canvas{display:block;width:100%;height:auto}
.url{font:500 2.4vh var(--f-display);color:var(--lyric);margin-top:1.4vh;overflow-wrap:anywhere}

.idle{background:radial-gradient(ellipse at 50% 115%,#3b2453 0%,#120d18 62%);gap:6vw;flex-wrap:wrap}
.idle .qrbox{width:min(34vh,40vw)}
.idle .txt{text-align:left;max-width:44vw}
.idle h1{font:600 7vh/1.05 var(--f-display);margin:0 0 2vh;text-wrap:balance}
.idle p{font-size:2.6vh;color:var(--muted);margin:0;max-width:36ch}
.party{font:600 4.2vh/1.15 var(--f-display);color:var(--lyric);margin:0 0 1.4vh;text-wrap:balance}
.ovparty{font:500 2.4vh var(--f-display);color:var(--lyric);margin-bottom:1vh}
.brandmark{position:fixed;left:3vw;top:3vh;font:600 2.6vh var(--f-display);display:flex;align-items:center;gap:1vh}
.brandmark i{width:1.4vh;height:1.4vh;border-radius:50%;background:var(--lyric);box-shadow:0 0 1.6vh var(--lyric)}

.start{background:#120d18f5;flex-direction:column;gap:2.4vh;z-index:10}
.start h1{font:600 6vh var(--f-display);margin:0}
.start p{font-size:2.4vh;color:var(--muted);margin:0;max-width:52ch}
.btn{border:0;background:var(--lyric);color:var(--lyric-ink);font:600 3vh var(--f-display);padding:2vh 5vh;border-radius:1.6vh;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #ffffff40;font-size:2.2vh;padding:1.2vh 3vh}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

.overlay{background:#0d0912f0;flex-direction:column;gap:1.6vh;z-index:5}
.overlay .lbl{font-size:2vh;letter-spacing:.2em;text-transform:uppercase;color:var(--cue)}
.overlay .t{font:500 6vh/1.2 var(--f-display);max-width:24ch;text-wrap:balance}
.overlay .who{font:500 4vh var(--f-display);color:var(--lyric)}
.overlay .count{font:600 12vh/1 var(--f-display);color:var(--lyric);font-variant-numeric:tabular-nums}
.overlay .after{font-size:2.2vh;color:var(--muted);max-width:60ch}

/* lower-third shown for a few seconds when a song starts */
.lower{position:fixed;left:3vw;bottom:6vh;max-width:min(70vw,900px);background:linear-gradient(90deg,#120d18f0,#120d18c0);border-left:.6vh solid var(--lyric);padding:1.6vh 2.4vh;border-radius:0 1.2vh 1.2vh 0;z-index:4;transition:opacity .6s, transform .6s}
.lower.off{opacity:0;transform:translateY(2vh);pointer-events:none}
.lower .lbl{font-size:1.6vh;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lower .t{font:500 3.4vh/1.25 var(--f-display)}
.lower .who{font:500 2.6vh var(--f-display);color:var(--lyric)}

.corner{position:fixed;right:2vw;top:3vh;z-index:3;display:flex;flex-direction:column;align-items:center;gap:.6vh;opacity:.9;pointer-events:none}
.corner .qrbox{width:12vh}
.corner span{font:500 1.5vh var(--f-display);background:#000a;padding:.2vh 1vh;border-radius:.6vh}
.wipe{position:fixed;left:0;right:0;bottom:0;height:.6vh;z-index:3;background:#ffffff14}
.wipe i{display:block;height:100%;width:0;background:var(--lyric);transition:width .5s linear}
.toast{position:fixed;left:50%;top:4vh;transform:translateX(-50%);background:var(--ink);color:#120d18;padding:1.2vh 2.4vh;border-radius:1.2vh;font:500 2.2vh var(--f-body);z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){.lower,.wipe i{transition:none}}
</style>
</head>
<body>
<div id="player"></div>

<div class="layer idle" id="idle">
  <div class="brandmark"><i></i><span data-party>Oilkara</span></div>
  <div class="qrbox" data-qr></div>
  <div class="txt">
    <div class="party" data-party-big hidden></div>
    <h1>สแกนเพื่อขอเพลง</h1>
    <p>เปิดกล้องมือถือแล้วสแกน QR ใส่ชื่อ เลือกเพลง เพลงแรกจะขึ้นจอนี้ทันที</p>
    <div class="url" data-url></div>
  </div>
</div>

<div class="corner" id="corner" hidden><div class="qrbox" data-qr></div><span>สแกนขอเพลง</span></div>

<div class="lower off" id="lower">
  <div class="lbl" id="lowLbl">กำลังร้อง</div>
  <div class="t" id="lowT"></div>
  <div class="who" id="lowWho"></div>
</div>

<div class="layer overlay" id="overlay" hidden>
  <div class="ovparty" data-party-big hidden></div>
  <div class="lbl">เพลงถัดไป</div>
  <div class="t" id="ovT"></div>
  <div class="who" id="ovWho"></div>
  <div class="count" id="ovCount">5</div>
  <div class="after" id="ovAfter"></div>
</div>

<div class="layer start" id="start">
  <h1>จอทีวี Oilkara</h1>
  <p>วางหน้าต่างนี้ไว้ตรงที่จะฉาย เช่น ครึ่งขวาของจอ หรือบนทีวี แล้วเลือกวิธีเริ่ม วิดีโอจะเล่นต่อกันเอง ควบคุมคิวได้จากหน้าหลักหรือมือถือ</p>
  <button class="btn" id="noFs">▶ เริ่มฉายในหน้าต่างนี้</button>
  <button class="btn ghost" id="startBtn">เริ่มแบบเต็มจอ (ทั้งจอที่หน้าต่างนี้อยู่)</button>
  <button class="btn ghost" id="otherFs" hidden>เริ่มแบบเต็มจอบนจออื่น</button>
</div>

<div class="wipe" id="wipeBar" hidden><i id="wipe"></i></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const COUNTDOWN = 5;
  let S = { now:null, queue:[], ver:-1, autoNext:true, cmd:{ id:0 } };
  let player = null, ready = false, started = false, playing = false, loadedUid = null, lastCmd = null;

  function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500); }

  // ---------- QR ----------
  fetch('/api/info').then(r => r.json()).then(info => {
    document.querySelectorAll('[data-url]').forEach(el => el.textContent = info.requestUrl);
    document.querySelectorAll('[data-qr]').forEach(el => {
      if (window.QRCode) new QRCode(el, { text:info.requestUrl, width:256, height:256, correctLevel:QRCode.CorrectLevel.M });
      else el.hidden = true;
    });
  }).catch(() => {});

  // ---------- heartbeat: reports player status, receives queue + remote commands ----------
  async function beat(){
    let cur = 0, dur = 0;
    if (ready && S.now) { try { cur = player.getCurrentTime(); dur = player.getDuration(); } catch(e){} }
    try {
      const r = await fetch('/api/tv', { method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ started, uid:loadedUid, playing, cur, dur }) });
      const s = await r.json();
      if (lastCmd === null) lastCmd = s.cmd?.id ?? 0;      // ignore commands sent before this screen opened
      if (s.cmd && s.cmd.id > lastCmd) { lastCmd = s.cmd.id; runCmd(s.cmd.cmd); }
      if (s.ver !== S.ver) { S = s; sync(); showParty(); }
      else S.autoNext = s.autoNext;
    } catch(e){}
    $('#wipe').style.width = dur ? (cur/dur*100).toFixed(2) + '%' : '0';
  }
  beat(); setInterval(beat, 1000);

  function showParty(){
    const name = (S.partyName || '').trim();
    document.querySelectorAll('[data-party]').forEach(el => el.textContent = name || 'Oilkara');
    document.querySelectorAll('[data-party-big]').forEach(el => { el.textContent = name; el.hidden = !name; });
    document.title = name ? `${name} · Oilkara TV` : 'Oilkara TV';
  }

  async function act(type, extra={}){
    try {
      const r = await fetch('/api/action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ type, host:true, ...extra }) });
      const j = await r.json(); if (j.state && j.state.ver !== S.ver) { S = j.state; sync(); }
    } catch(e){}
  }

  function runCmd(cmd){
    if (!ready || !S.now) return;
    if (cmd === 'toggle') playing ? player.pauseVideo() : player.playVideo();
    else if (cmd === 'play') player.playVideo();
    else if (cmd === 'pause') player.pauseVideo();
    else if (cmd === 'restart') { player.seekTo(0, true); player.playVideo(); }
  }

  // ---------- player ----------
  window.onYouTubeIframeAPIReady = () => {
    const vars = { autoplay:1, rel:0, playsinline:1, modestbranding:1, iv_load_policy:3, controls:0, fs:0, disablekb:1 };
    if (location.protocol.startsWith('http')) vars.origin = location.origin;
    player = new YT.Player('player', {
      width:'100%', height:'100%', playerVars:vars,
      events:{
        onReady:() => { ready = true; sync(); },
        onStateChange:onState,
        onError:e => {
          toast((e.data === 101 || e.data === 150) ? 'เจ้าของวิดีโอไม่อนุญาตให้เล่นนอก YouTube ข้ามไปเพลงถัดไป' : 'เล่นวิดีโอนี้ไม่ได้ ข้ามไปเพลงถัดไป');
          const uid = S.now?.uid; setTimeout(() => act('next', { expect:uid }), 2000);
        }
      }
    });
  };

  function sync(){
    const has = !!S.now;
    $('#idle').hidden = has;
    $('#corner').hidden = !has;
    $('#wipeBar').hidden = !has;
    if (!ready || !started) return;
    const uid = S.now?.uid || null;
    if (uid === loadedUid) return;
    loadedUid = uid; hideOverlay();
    if (!uid) { try { player.stopVideo(); } catch(e){} return; }
    player.loadVideoById(S.now.id);
    showLower();
  }

  function onState(e){
    playing = e.data === YT.PlayerState.PLAYING;
    if (e.data === YT.PlayerState.ENDED && S.now) {
      // music mode plays straight through; karaoke shows the next-singer countdown
      if (S.queue.length && S.autoNext !== false) { S.mode === 'music' ? act('next', { expect:S.now.uid }) : showOverlay(); }
      else if (!S.queue.length) act('next', { expect:S.now.uid });
    }
  }

  let lowerT = null;
  function showLower(){
    $('#lowT').textContent = S.now.title;
    const music = S.mode === 'music';
    $('#lowLbl').textContent = music ? 'กำลังเล่น' : 'กำลังร้อง';
    $('#lowWho').textContent = S.now.singer ? `${music ? 'ขอโดย' : 'ผู้ร้อง'}: ${S.now.singer}` : '';
    $('#lower').classList.remove('off');
    clearTimeout(lowerT); lowerT = setTimeout(() => $('#lower').classList.add('off'), 7000);
  }

  let cdTimer = null;
  function showOverlay(){
    const n = S.queue[0], expect = S.now.uid, after = S.queue[1];
    $('#ovT').textContent = n.title;
    $('#ovWho').textContent = n.singer ? `ผู้ร้อง: ${n.singer}` : '';
    $('#ovAfter').textContent = after ? `ต่อจากนั้น: ${after.title}${after.singer ? ' — ' + after.singer : ''}` : '';
    let left = COUNTDOWN; $('#ovCount').textContent = left; $('#overlay').hidden = false;
    clearInterval(cdTimer);
    cdTimer = setInterval(() => { left--; $('#ovCount').textContent = Math.max(left, 0); if (left <= 0) { clearInterval(cdTimer); act('next', { expect }); } }, 1000);
  }
  function hideOverlay(){ clearInterval(cdTimer); $('#overlay').hidden = true; }

  // ---------- start / fullscreen ----------
  let wakeLock = null;
  async function keepAwake(){ try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && started) keepAwake(); });
  function go(fs){
    if (fs) { try { document.documentElement.requestFullscreen()?.catch(() => {}); } catch(e){} }
    started = true; $('#start').hidden = true; keepAwake(); sync(); beat();
  }
  $('#startBtn').onclick = () => go(true);
  $('#noFs').onclick = () => go(false);
  // fullscreen on the other monitor without dragging (Chrome/Edge window-management permission)
  if ('getScreenDetails' in window && window.screen.isExtended !== false) {
    $('#otherFs').hidden = false;
    $('#otherFs').onclick = async () => {
      try {
        const sd = await window.getScreenDetails();
        const other = sd.screens.find(s => s !== sd.currentScreen);
        if (!other) { toast('เบราว์เซอร์เห็นจอเดียว ตั้งจอเป็นแบบ Extend ก่อน (Win + P)'); return; }
        await document.documentElement.requestFullscreen({ screen:other });
        go(false);
      } catch(e){ toast('ไม่ได้รับอนุญาตให้ใช้จอที่สอง ลากหน้าต่างไปที่ทีวีแล้วกด “เริ่มฉายบนจอนี้”'); }
    };
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (!started) return;
    if (k === ' ') { e.preventDefault(); runCmd('toggle'); }
    else if (k === 'n') act('next', { expect:S.now?.uid });
    else if (k === 'f') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch(e){} }
  });

  // hide the mouse pointer when it sits still on the TV
  let mouseT = null;
  document.addEventListener('mousemove', () => { document.body.classList.remove('hide-cursor'); clearTimeout(mouseT); mouseT = setTimeout(() => document.body.classList.add('hide-cursor'), 2500); });
})();
</script>
</body>
</html>
